name: Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      # Faza 1: --deactivate-stale = report-only u ISTOM prolazu (bez --apply, bez gašenja).
      - run: python scraper/scraper.py --all --deactivate-stale
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Osiguraj barkod-mapiranje i ako scrape nije ništa upisao / partial run
      - name: Link deal barcodes from regular_prices
        run: python scraper/link_product_barcodes.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Faza 0: samo čitanje + FLYER_STATS. Ne šalje push, ne piše, bez VAPID.
      # continue-on-error: nikad ne ruši scrape.
      - name: Detect new flyers (dry-run)
        continue-on-error: true
        run: python scraper/detect_new_flyers.py --dry-run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Faza 2: flyer push s --send (samo Eurospin/Kaufland/Plodine u skripti).
      - name: Send flyer pushes
        continue-on-error: true
        run: python scraper/send_flyer_pushes.py --limit 500 --send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
