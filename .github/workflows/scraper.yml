name: Scraper

on:
  schedule:
    # 02:17 UTC = 03:17 Europe/Zagreb (zima). Minuta ≠ 0 — manje GH schedule kašnjenja.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      # Faza 1: --deactivate-stale = report-only u ISTOM prolazu (bez --apply, bez gašenja).
      - run: python scraper/scraper.py --all --deactivate-stale
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Osiguraj barkod-mapiranje i ako scrape nije ništa upisao / partial run
      - name: Link deal barcodes from regular_prices
        run: python scraper/link_product_barcodes.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Faza 0: samo čitanje + FLYER_STATS. Ne šalje push, ne piše, bez VAPID.
      # continue-on-error: nikad ne ruši scrape.
      - name: Detect new flyers (dry-run)
        continue-on-error: true
        run: python scraper/detect_new_flyers.py --dry-run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Flyer pushes: zaseban workflow flyer-pushes.yml (~07:xx UTC), ne ovdje.
