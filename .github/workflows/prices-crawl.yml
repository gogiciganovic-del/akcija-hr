name: Regular prices crawl

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

env:
  # Soft warning only (import emits price_changes_high). Tune after a few runs.
  IMPORT_PRICE_CHANGES_MAX_WARN: "15000"

jobs:
  crawl-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Clone cijene-api (ephemeral)
        run: git clone --depth 1 https://github.com/senko/cijene-api.git /tmp/cijene-api

      - name: Install crawler deps (uv)
        working-directory: /tmp/cijene-api
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync

      - name: Crawl price lists
        working-directory: /tmp/cijene-api
        run: |
          mkdir -p /tmp/cijene-out
          uv run -m crawler.cli.crawl /tmp/cijene-out \
            -c lidl,konzum,kaufland,spar,plodine,eurospin,tommy,studenac,dm \
            -z false \
            -v info

      - name: Install importer deps
        run: pip install -r scraper/requirements.txt

      - name: Record push since timestamp
        id: push_since
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Import into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IMPORT_PRICE_CHANGES_MAX_WARN: ${{ env.IMPORT_PRICE_CHANGES_MAX_WARN }}
        run: |
          set -o pipefail
          DATE_DIR=$(ls -1 /tmp/cijene-out | head -n 1)
          echo "Importing from /tmp/cijene-out/${DATE_DIR}"
          python scraper/import_regular_prices.py \
            --input "/tmp/cijene-out/${DATE_DIR}" \
            --chains lidl,konzum,kaufland,spar,plodine,eurospin,tommy,studenac,dm \
            2>&1 | tee /tmp/import.log

      # --limit 5: prvi mali korak nakon čistog schedule runa; dalje podizati postupno
      - name: Send price-drop push notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set -o pipefail
          python scraper/send_price_drop_pushes.py \
            --since "${{ steps.push_since.outputs.since }}" \
            --limit 5 \
            2>&1 | tee /tmp/push.log

      - name: Write monitoring job summary
        if: always()
        run: |
          python scraper/ci_write_job_summary.py \
            --import-log /tmp/import.log \
            --push-log /tmp/push.log
